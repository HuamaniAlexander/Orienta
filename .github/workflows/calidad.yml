name: Calidad primera mitad
on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev, 'feature/**']
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run test
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: orienta_test
          POSTGRES_USER: orienta
          POSTGRES_PASSWORD: ephemeral-test-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U orienta -d orienta_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://orienta:ephemeral-test-password@localhost:5432/orienta_test
      DATABASE_URL: postgresql+psycopg://orienta:ephemeral-test-password@localhost:5432/orienta_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m ruff check app tests alembic
      - run: python -m pytest -q --basetemp=.pytest_tmp
      - run: python -m alembic upgrade head
      - run: python -m alembic check
      - run: python -m app.infrastructure.cargar_catalogo
      - run: python -m app.infrastructure.cargar_catalogo
      - run: python -m app.infrastructure.entrenar_modelos --salida .local/retrained
